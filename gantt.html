  'use strict';
  const planner = createEdentalPlanner(GanttEngine, EDENTAL_PRICING, EDENTAL_MATH, EDENTAL_CALENDAR, EDENTAL_STAGE_SPLITS);
  const mount = document.getElementById('gantt');
  const escape = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
  const date = value => value.slice(8, 10) + '.' + value.slice(5, 7) + '.' + value.slice(0, 4);
  const money = (min, max = min) => {
    const format = value => new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 }).format(value / 100);
    return format(min) + (min === max ? '' : ' – ' + format(max)) + ' ₽';
  };
  const interval = (start, end) => start.slice(0, 4) === end.slice(0, 4) ? date(start).slice(0, 5) + '–' + date(end) : date(start) + '–' + date(end);
  try {
    const plan = planner.calculate(planner.fromSearch(location.search));
    const pageLayouts = createEdentalPageLayout(planner.calendar, EDENTAL_PAGE_ALLOCATIONS).forPlan(plan);
    const layoutByUnit = new Map(pageLayouts.map(layout => [layout.unitId, layout]));
    document.getElementById('project-dates').textContent = interval(plan.start, plan.finish);
    document.getElementById('plan-caption').textContent = 'Предварительная дата старта — ' + date(plan.start) + '. ' + (plan.state.scenario === 'min' ? 'План по нижней границе сроков КП' : 'План по верхней границе сроков КП') + '. Плановая разбивка страниц внутри сроков этапов; короткие задачи могут делить рабочий день.';
    document.getElementById('project-total').textContent = money(plan.total.minCents, plan.total.maxCents);
    const axis = EdentalGanttView.axis(plan.start, plan.finish, planner.calendar);
    const days = axis.count;
    const dayIndex = value => EdentalGanttView.index(axis.start, value);
    const percent = value => dayIndex(value) * 100 / days;
    const monthNames = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
    const weekdays = ['вс','пн','вт','ср','чт','пт','сб'];
    const weekLines = axis.weeks.map(item => '<i class="weekline" style="left:' + item.index * 100 / days + '%"></i>').join('');
    const offBands = axis.off.map(item => '<i class="offday-band" style="left:' + item.index * 100 / days + '%;width:' + item.length * 100 / days + '%" aria-hidden="true"></i>').join('');
    const dayLines = axis.dates.map(item => '<i class="dayline" style="left:' + item.index * 100 / days + '%"></i>').join('');
    const calendarGrid = offBands + dayLines + weekLines;
    const header = '<div class="gridrow head"><div class="left"><b>Этапы, состав и платежи</b></div><div class="axis" id="calendar-axis"></div></div>';
    const rows = [], positions = new Map();
    function bar(item, color, summary = false) {
      const left = percent(item.start), width = (dayIndex(item.end) - dayIndex(item.start) + 1) * 100 / days;
      positions.set(item.id, { id: item.id, x1: left, x2: left + width });
      const breaks = summary ? '' : EdentalGanttView.barBreaks(item.start, item.end, planner.calendar).map(gap => '<i class="bar-break" style="left:' + gap.left + '%;width:' + gap.width + '%" aria-hidden="true"></i>').join('');
      return '<div class="bar' + (summary ? ' summary' : '') + '" style="left:' + left + '%;width:' + width + '%;background:' + color + '" role="img" aria-label="' + escape(item.title + ': ' + interval(item.start, item.end)) + '">' + breaks + '</div>';
    }
    function payableRow(unit, color, nested = false) {
      const children = layoutByUnit.has(unit.id) ? '' : '<ol class="substeps">' + unit.substeps.map(title => '<li>' + escape(title) + '</li>').join('') + '</ol>';
      const parallel = unit.stage === 'website' && unit.kind === 'development' ? '<p class="phase-parallel">Управление и согласования — на всём этапе</p>' : '';
      const payments = unit.payments.map(payment => '<div class="payment-item ' + payment.type + '"><span><i aria-hidden="true">' + (payment.type === 'advance' ? '◆' : '●') + '</i> ' + (payment.type === 'advance' ? '50% до начала' : '50% после завершения') + ' · ' + date(payment.date) + '</span><b>' + money(payment.minCents, payment.maxCents) + '</b></div>').join('');
      const markers = unit.payments.map(payment => '<span class="payment-marker ' + payment.type + '" style="left:' + (percent(payment.date) + 50 / days) + '%" role="img" aria-label="' + escape((payment.type === 'advance' ? 'Аванс 50%: ' : 'Оплата 50% после завершения: ') + date(payment.date) + ', ' + money(payment.minCents, payment.maxCents)) + '"></span>').join('');
      return '<div class="gridrow phase payable' + (nested ? ' website-part' : '') + '" data-id="' + escape(unit.id) + '"><div class="left"><div class="phase-main"><strong>' + escape(unit.title) + '</strong><b class="phase-price">' + money(unit.minCents, unit.maxCents) + '</b><div class="phase-dates">' + interval(unit.start, unit.end) + '</div><div class="unit-payments">' + payments + '</div></div>' + children + parallel + '</div><div class="track">' + calendarGrid + bar(unit, color) + markers + '</div></div>';
    }
    function slotLabel(slot) {
      const partialDay = slot.start === slot.end && slot.endDay - slot.startDay < 1 - 1e-7;
      return (slot.start === slot.end ? date(slot.start) : interval(slot.start, slot.end)) + (partialDay ? ' · часть дня' : '');
    }
    function slotBar(slot, kind, title) {
      const first = dayIndex(slot.start) + slot.startFraction;
      const last = dayIndex(slot.end) + slot.endFraction;
      const width = last - first;
      const pieces = slot.segments.map(segment => '<i class="page-working-piece ' + kind + '" style="left:' + (dayIndex(segment.date) + segment.startFraction - first) * 100 / width + '%;width:' + (segment.endFraction - segment.startFraction) * 100 / width + '%" aria-hidden="true"></i>').join('');
      const label = kind === 'front' ? 'Фронтенд' : kind === 'back' ? 'Бэкенд' : '';
      return '<div class="bar page-segment ' + kind + '" style="left:' + first * 100 / days + '%;width:' + width * 100 / days + '%" role="img" title="' + escape((label ? label + ': ' : '') + title + ' — ' + slotLabel(slot)) + '" aria-label="' + escape((label ? label + ': ' : '') + title + ' — ' + slotLabel(slot)) + '">' + pieces + '<span>' + label + '</span></div>';
    }
    function serviceRow(item) {
      return '<div class="gridrow page-service" data-service-id="' + escape(item.id) + '"><div class="left"><strong>' + escape(item.title) + '</strong><span>' + slotLabel(item) + '</span></div><div class="track">' + calendarGrid + slotBar(item, 'service', item.title) + '</div></div>';
    }
    function pageRows(unit) {
      const layout = layoutByUnit.get(unit.id);
      if (!layout) return '';
      const heading = '<div class="gridrow page-heading" id="pages-' + layout.stageId + '"><div class="left"><strong>' + (layout.stageId === 'mvp' ? 'Страницы MVP' : 'Страницы этапа ' + layout.stageId.slice(-1)) + ' · ' + layout.pages.length + '</strong></div><div class="track">' + offBands + '</div></div>';
      const before = layout.common.filter(item => item.position === 'before-pages').map(serviceRow).join('');
      const after = layout.common.filter(item => item.position === 'after-pages').map(serviceRow).join('');
      const pages = layout.pages.map(page => '<div class="gridrow page-row" data-page-id="' + escape(page.id) + '"><div class="left"><strong>' + escape(page.title) + '</strong><div class="page-ranges"><span class="front-label">Фронтенд · ' + slotLabel(page.front) + '</span><span class="back-label">Бэкенд · ' + slotLabel(page.back) + '</span></div></div><div class="track">' + calendarGrid + slotBar(page.front, 'front', page.title) + slotBar(page.back, 'back', page.title) + '</div></div>').join('');
      return heading + before + pages + after;
    }
    for (const group of plan.project.stages) {
      const tasks = plan.phases.filter(task => task.stage === group.id);
      if (!tasks.length) continue;
      const min = tasks.reduce((sum, task) => sum + task.minCents, 0), max = tasks.reduce((sum, task) => sum + task.maxCents, 0);
      rows.push('<div class="gridrow group"><div class="left"><strong>' + escape(group.label) + '</strong><span>' + money(min, max) + '</span></div><div class="track">' + offBands + '</div></div>');
      for (const task of tasks) {
        const units = plan.paymentUnits.filter(unit => unit.phaseId === task.id);
        if (task.stage === 'identity') rows.push(payableRow(units[0], group.color));
        else {
          rows.push('<div class="gridrow website-parent" data-id="' + escape(task.id) + '"><div class="left"><strong>' + escape(task.title) + '</strong><b>' + money(task.minCents, task.maxCents) + '</b><span>' + interval(task.start, task.end) + '</span></div><div class="track">' + calendarGrid + bar(task, group.color, true) + '</div></div>');
          rows.push(...units.map(unit => payableRow(unit, unit.kind === 'design' ? '#739180' : '#36765e', true) + pageRows(unit)));
        }
      }
    }
    const links = [];
    for (const task of plan.phases) {
      for (let dependency of task.dependsOn) {
        if (dependency === 'identity-ready') dependency = plan.phases.some(item => item.id === 'identity-carriers') ? 'identity-carriers' : 'identity-core';
        const from = positions.get(dependency), to = positions.get(task.id);
        if (from && to) links.push({ from, to });
      }
      if (task.stage === 'website') links.push({ from: positions.get(task.id + '-design'), to: positions.get(task.id + '-development') });
    }
    mount.innerHTML = '<div class="chart-content">' + header + rows.join('') + '<svg class="client-dependencies" aria-hidden="true"></svg></div>';
    const content = mount.firstElementChild, svg = content.querySelector('svg');
    function drawLinks() {
      const origin = content.getBoundingClientRect();
      const labelWidth = content.querySelector('.left').getBoundingClientRect().width, trackWidth = content.querySelector('.axis').getBoundingClientRect().width;
      const x = value => labelWidth + value * trackWidth / 100;
      const y = position => { const bounds = content.querySelector('[data-id="' + position.id + '"] .bar').getBoundingClientRect(); return bounds.top - origin.top + bounds.height / 2; };
      svg.setAttribute('width', content.offsetWidth); svg.setAttribute('height', content.offsetHeight);
      svg.innerHTML = '<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5" fill="#9aa99e"/></marker></defs>' + links.map(link => {
        const a = x(link.from.x2), b = x(link.to.x1), mid = a + Math.max(4, (b - a) / 2);
        return '<path d="M' + a + ',' + y(link.from) + ' H' + mid + ' V' + y(link.to) + ' H' + b + '" class="dependency" marker-end="url(#arrow)"/>';
      }).join('');
    }
    const axisMount = document.getElementById('calendar-axis');
    const buttons = [...document.querySelectorAll('[data-zoom]')];
    let mode = 'weeks', currentDimensions = null, anchorDay = 0;
    function calendarHeader(dayWidth) {
      const months = '<div class="months">' + axis.months.map(item => {
        const pixels = item.length * dayWidth, short = monthNames[Number(item.date.slice(5, 7)) - 1];
        const label = pixels >= 45 ? short + ' ' + item.date.slice(2, 4) : pixels >= 25 ? short : pixels >= 12 ? item.date.slice(5, 7) : '';
        return '<div style="width:' + item.length * 100 / days + '%" title="' + escape(item.key) + '">' + label + '</div>';
      }).join('') + '</div>';
      if (mode === 'overview') return offBands + months;
      if (mode === 'weeks') return offBands + months + '<div class="scale-row week-scale">' + axis.weeks.map(item => '<span style="left:' + item.index * 100 / days + '%;width:' + item.length * 100 / days + '%" title="Неделя с ' + date(item.date) + '">с ' + date(item.date).slice(0, 6) + item.date.slice(2, 4) + '</span>').join('') + '</div>';
      return offBands + months + '<div class="scale-row day-scale">' + axis.dates.map(item => '<span data-date="' + item.date + '" data-working="' + item.working + '" class="calendar-day' + (item.working ? '' : ' off') + '" style="left:' + item.index * 100 / days + '%;width:' + 100 / days + '%" title="' + date(item.date) + ' — ' + (item.working ? 'рабочий день' : 'выходной или праздник') + '"><b>' + date(item.date).slice(0, 5) + '</b><small>' + weekdays[item.weekday] + '</small></span>').join('') + '</div>';
    }
    function applyZoom(next) {
      if (currentDimensions && mode !== 'overview') anchorDay = mount.scrollLeft / currentDimensions.dayWidth;
      const labelWidth = content.querySelector('.left').getBoundingClientRect().width;
      currentDimensions = EdentalGanttView.dimensions(next, days, mount.clientWidth, labelWidth);
      mode = currentDimensions.mode;
      content.dataset.zoom = mode;
      content.style.width = currentDimensions.contentWidth + 'px';
      axisMount.innerHTML = calendarHeader(currentDimensions.dayWidth);
      for (const button of buttons) button.setAttribute('aria-pressed', String(button.dataset.zoom === mode));
      drawLinks();
      mount.scrollLeft = mode === 'overview' ? 0 : EdentalGanttView.scrollForAnchor(anchorDay, currentDimensions.dayWidth, Math.max(0, mount.scrollWidth - mount.clientWidth));
    }
    for (const button of buttons) button.addEventListener('click', () => applyZoom(button.dataset.zoom));
    applyZoom('weeks');
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(drawLinks).observe(content);
      new ResizeObserver(() => applyZoom(mode)).observe(mount);
    }
    function jumpToPages() {
      const id = location.hash.slice(1);
      if (!/^pages-(?:mvp|stage2|stage3)$/.test(id)) return;
      const target = document.getElementById(id);
      const layout = pageLayouts.find(item => 'pages-' + item.stageId === id);
      if (!target || !layout) return;
      const unit = plan.paymentUnits.find(item => item.id === layout.unitId);
      document.querySelector('.chart-section').scrollIntoView({ block: 'start' });
      const viewportTop = mount.getBoundingClientRect().top + mount.clientTop;
      const headerHeight = content.querySelector('.head').getBoundingClientRect().height;
      mount.scrollTop = Math.max(0, mount.scrollTop + target.getBoundingClientRect().top - viewportTop - headerHeight);
      anchorDay = Math.max(0, dayIndex(unit.start) - 2);
      mount.scrollLeft = mode === 'overview' ? 0 : EdentalGanttView.scrollForAnchor(anchorDay, currentDimensions.dayWidth, Math.max(0, mount.scrollWidth - mount.clientWidth));
    }
    window.addEventListener('hashchange', jumpToPages);
    requestAnimationFrame(jumpToPages);
    document.documentElement.dataset.ganttReady = 'true';
  } catch (error) { mount.innerHTML = '<p class="error" role="alert">' + escape(error.message) + '</p>'; }
})();
</script></body></html>
